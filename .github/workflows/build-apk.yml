
name: Build Maa Beri Cloth House APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract app project
        run: |
          mkdir -p /tmp/maa
          ZIP=$(find . -maxdepth 1 -iname '*.zip' -type f | head -n 1)
          test -n "$ZIP"
          unzip -q "$ZIP" -d /tmp/maa
          ROOT=$(dirname "$(find /tmp/maa -name package.json | head -n 1)")
          test -f "$ROOT/package.json"
          cp -R "$ROOT"/. .

      - name: Build APK
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Maa-Beri-Cloth-House-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
